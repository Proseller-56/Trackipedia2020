<style>
:root{--ink:#082a4d;--mute:#4a6580;--panel:#fff;--tint:#eaf5fc;--line:#c3dbea;--blue:#1666d8;--red:#d9261c;--grn:#1fa84a;--link:#0b55c0;--onc:#fff;
--sky:linear-gradient(180deg,#1259d0 0%,#1f86e4 30%,#35b4ec 48%,#a6e6f2 54%,#2fc455 60%,#14993b 100%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e3f2fb;--mute:#93b0c4;--panel:#0d2236;--tint:#12304a;--line:#24445f;--link:#7db4ff;--sky:linear-gradient(180deg,#07245a 0%,#0c4690 30%,#13709f 48%,#2a8d9a 54%,#127a35 60%,#0a5a26 100%)}}
:root[data-theme="dark"]{--ink:#e3f2fb;--mute:#93b0c4;--panel:#0d2236;--tint:#12304a;--line:#24445f;--link:#7db4ff;--sky:linear-gradient(180deg,#07245a 0%,#0c4690 30%,#13709f 48%,#2a8d9a 54%,#127a35 60%,#0a5a26 100%)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:#14993b}
body{margin:0;min-height:100vh;background:var(--sky) fixed;color:var(--ink);font:17px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3,.btn{font-family:"Chakra Petch",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 18px 56px}
a{color:var(--link)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:#fff}
.back{background:none;border:0;color:#fff;font:600 16px Figtree,sans-serif;cursor:pointer;padding:6px 0}
.stripe{height:10px;width:100%;margin:12px 0 22px;background:linear-gradient(90deg,#fff 0 72%,var(--red) 72%);border-radius:3px}
h1{font-size:clamp(2rem,8.5vw,4rem);line-height:1;margin:8px 0 0;letter-spacing:-1px;color:#fff;text-shadow:0 3px 0 rgba(0,30,90,.35)}
h2{font-size:2rem;margin:0 0 6px;color:#fff;text-shadow:0 2px 0 rgba(0,30,90,.35)}
h3{font-size:1.2rem;margin:26px 0 6px}
.sub{color:#fff;margin:0}
.menu{display:flex;flex-direction:column;gap:18px;margin-top:8px}
.btn{display:block;width:100%;text-align:left;font-size:2rem;font-weight:700;padding:24px 24px;border:0;border-radius:14px;background:#fff;color:#082a4d;cursor:pointer;border-left:16px solid var(--c);box-shadow:0 6px 0 rgba(0,40,90,.3)}
.btn small{display:block;font:500 .95rem Figtree,sans-serif;color:#4a6580;margin-top:2px}
.b1{--c:#1666d8}.b2{--c:#d9261c}.b3{--c:#1fa84a}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,40,90,.3)}
.panel{background:var(--panel);border-radius:14px;padding:16px 18px;box-shadow:0 6px 0 rgba(0,40,90,.25)}
.foot{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:34px}.fbtn{background:var(--panel);color:var(--ink);border:0;border-left:10px solid var(--c);border-radius:14px;padding:14px 16px;text-align:left;font:500 16px/1.4 Figtree,system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 0 rgba(0,40,90,.25)}.fbtn b{font-family:"Chakra Petch",system-ui,sans-serif;font-size:1.05rem}.fbtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,40,90,.25)}
.send{background:var(--red);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:600 16px Figtree,sans-serif;cursor:pointer}
.send:disabled{opacity:.6}
input[type=search],input[type=text],input[type=email],input[type=password],textarea{width:100%;font:inherit;color:var(--ink);background:var(--tint);border:2px solid var(--line);border-radius:10px;padding:11px 13px}
.term{padding:14px 0;border-bottom:1px solid var(--line)}
.term:last-child{border-bottom:0}
.term b{font-family:"Chakra Petch",sans-serif;font-size:1.1rem;color:var(--link)}
.term p{margin:2px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{border:0;background:#fff;color:#082a4d;border-radius:999px;padding:9px 20px;font:600 16px Figtree,sans-serif;cursor:pointer;box-shadow:0 3px 0 rgba(0,40,90,.3)}
.tab[aria-pressed=true]{background:var(--red);color:#fff}
.box{background:var(--panel);border-radius:14px;padding:6px 18px 16px;box-shadow:0 6px 0 rgba(0,40,90,.25)}
.note{color:var(--mute);font-size:.95rem}
table{border-collapse:collapse;margin:8px 0}td,th{border:1px solid var(--line);padding:5px 12px;text-align:left}
.wrap{overflow-x:auto}
.chat{background:var(--tint);border-radius:12px;height:340px;overflow-y:auto;padding:12px;margin:0 0 14px}
.msg{padding:8px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.msg b{color:var(--red)}.msg time{color:var(--mute);font-size:.8rem;margin-left:6px}
.row{display:flex;gap:10px;margin-top:10px}
.row>*:first-child{flex:0 0 38%}
@media (max-width:520px){.row{flex-direction:column}.row>*:first-child{flex:none}}
.empty{color:var(--mute)}

/* ===== Legal links, ad slot and modal ===== */
.site-bottom{max-width:720px;margin:0 auto;padding:0 18px 96px}
.legal{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.lk{background:#fff;color:#082a4d;border:0;border-radius:999px;padding:9px 20px;font:600 15px Figtree,system-ui,sans-serif;cursor:pointer;box-shadow:0 3px 0 rgba(0,40,90,.3)}
.lk.small{background:rgba(255,255,255,.8);font-weight:500}
/* AD WRAPPER: strict 30px top/bottom margin keeps ads away from buttons and inputs (AdSense accidental-click policy).
   min-height reserves space so the page doesn't jump when an ad loads (layout shift protection). */
.ad-wrapper{display:block;margin:30px auto;min-height:250px;padding:6px 12px 12px;text-align:center;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.6);border-radius:10px}
.ad-label{display:block;font-size:12px;letter-spacing:.04em;margin-bottom:6px;color:#fff}
.adsbygoogle{display:block;min-height:200px}
/* No ad code yet (still commented out): collapse completely, no empty box. */
.ad-wrapper:not(:has(ins.adsbygoogle)){display:none}
/* Preview while building: shows the light "Advertisement" box. Turned on by AD_PREVIEW in the script. */
body.ad-preview .ad-wrapper:not(:has(ins.adsbygoogle)){display:block}
/* Google returned an empty slot: hide it. */
.adsbygoogle[data-ad-status="unfilled"]{display:none!important}
.ad-wrapper:has(.adsbygoogle[data-ad-status="unfilled"]){display:none!important}
.support{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.92rem;line-height:1.45;background:var(--panel);color:var(--ink);border-top:4px solid var(--blue);box-shadow:0 -4px 12px rgba(0,40,90,.25)}
.support a{color:var(--link);font-weight:600}
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,20,50,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--panel);color:var(--ink);border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;padding:14px 20px 20px;outline:0}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-head h2{color:var(--ink);text-shadow:none;font-size:1.5rem;margin:0}
#mx{background:none;border:0;font-size:2rem;line-height:1;color:var(--ink);cursor:pointer;padding:4px 10px}
#mb p{white-space:pre-line;margin:10px 0}
#mb h3{margin:22px 0 6px}
#mb label{display:block;margin:12px 0 4px;font-weight:600}
#mb .send{margin-top:10px}
#mb .stat{margin-left:10px;color:var(--mute);font-size:.95rem}

["Action Keys","Set of keybinds meant to control steering to limited increments, especially useful on alt cars. Key 1 is 20%, 2 is 40%, 3 is 60%, 4 is 80% and 5 is 100%. They change your steering curve, so steering halfway to maximum (on your device) on action key 3 is 30% steering."],
["Airbrake","Tapping brakes in midair will stop the car's rotation, allowing the car to land flat on the ground instead of front/back wheels first."],
["AT / Author Medal","A medal achieved by beating the author's time on a map."],
["Airtime","The time when the car doesn't touch the ground."],
["Bugslide","A technique to make very sharp and fast turns on surfaces like grass, dirt and plastic, though it is still possible on road. Requires landing the car sideways at 90 degrees."],
["Countersteer","Technique to stop the car's sideways rotation mid-air by steering in the opposite direction of the rotation."],
["CP","Short for checkpoint."],
["Cruise Control","Special block that locks the player's speed to what it was when they touched the block/gate, until they reach a reset block or a checkpoint."],
["COTD / Cuppa","Cup of the Day: the single-life knockout played on that day's track of the day."],
["Dirt","A surface on which the car has less grip and acceleration than road. It requires good management of gears."],
["DNF","\"Did Not Finish\": a player giving up or failing to finish a track, usually during a match."],
["Fakeflag","Choosing a flag of a nationality different from your actual nationality."],
["FF","Either Fake Finish (a finish block that isn't the intended finish, often used as a GPS trigger) or Forfeit."],
["FS / Fullspeed","Style of maps made of speedslides, loopings, wallrides and precision."],
["Freewheel / Engine Off","Special block that cuts off a player's engine, so they can't accelerate until they reach a reset block or a checkpoint."],
["GS / Grass Slide","Alternative name for a Bugslide."],
["Iceslide","A technique used to get better control over the car on the ice surface."],
["Identity","Specific segment of a map that makes it immediately recognisable, usually the most creative and difficult segment and/or one requiring special tricks to clear."],
["Kacky","Style of maps that are very difficult to finish, mostly only by using certain techniques."],
["Lol / Lunatic","Style of maps that require lucky and/or precise tricks."],
["Landing Bug","A bug that causes you to lose control or speed when landing, most common where 2 plastic blocks join."],
["LAN","An offline competition where players gather in person."],
["Mixed Map","A map that drives on multiple different surfaces."],
["Nascar","A map/turn driven without braking or sliding, only releasing."],
["NeoSlide","Technique to allow the car to drift at low speed."],
["No-Brake","Special block that makes the player unable to brake until they reach a reset block or a checkpoint."],
["No-Steer","Special block that makes the player unable to steer until they reach a reset block or a checkpoint."],
["No-slide","Technique used on dirt, grass or plastic to avoid sliding. Can also describe a player trying to start a drift but failing, usually causing a failed turn, or a map or section driven without sliding."],
["NB / Nosebug","Technique to get the stadium car thrown in one direction. The car must be perpendicular to the ground."],
["Openplanet","The main source of plugins for Trackmania."],
["PB","Short for personal best."],
["Pf","Short for press forward, but can also mean easy."],
["Platform Map","A type of map in which players try to finish while respawning as few times as possible."],
["Quantumslide","Another word for no-slide, specifically meaning to intentionally no-slide on dirt/plastic/grass and still Speedslide."],
["Reactor","An effect block with 4 options: orange/red reactor and green reactor, each with reactor up and down. Reactor up pushes your car in the opposite direction to where the bottom faces; reactor down pushes your car in the direction the bottom of your car faces."],
["Release","Not to accelerate."],
["RMC / RMS","Random Map Challenge / Random Map Survival. A minigame within Trackmania 2020 where the goal is to collect medals or world records on random tracks. Requires a plugin."],
["RMT","Random Map Together. A community format similar to RMC, but played cooperatively."],
["RPG","Style of maps that often includes many tricks, obstacles, puzzles and jumps."],
["Riolu Mode","Playing in slowmotion, either cheating or from the effect block."],
["Slowmotion","Special block that lets the player drive in slowmotion until they reach a reset block or a checkpoint."],
["Speedslide / SD","Technique to accelerate faster when already at high speed by holding a specific drift angle."],
["S4D","A speedslide initiated by pressing the brake."],
["Smooth Steering","Gentle steering on an analogue input to avoid sliding on surfaces like dirt, grass, plastic, or when having icy/wet tires. Builds more speed through the turn at the expense of a very limited turn radius. Especially useful on the alt cars."],
["Tech","Style of maps made mostly of drifts on the road."],
["TMX","Trackmania Exchange. Popular community-driven website with a track database where players share and play maps, take part in map requests and competitions, and compete for the best times."],
["TMI","Trackmania Interface. Popular community-driven tool for creating tool-assisted speedruns, developed by the player Donadigo."],
["TAS","Tool Assisted Speedrun."],
["Trackmaster","The highest rank achievable in ranked mode."],
["Uberbug","Technique often used in Kacky events to make the car fly. It requires a bugslide into an object."],
["Wallbang / Wallhit","Technique of hitting a wall instead of drifting or releasing to turn sharply."],
["Wiggles","Technique to accelerate faster on surfaces like dirt, grass and ice by doing small left-right wiggles to chain small speedslides. On the alt cars, wiggles skip penalty by lifting one side of the car up."],
["Zoop","A reactor trick that gains a large amount of speed. Can also apply to a trick on ice boosters with the snowcar."]
].sort(function(a,b){return a[0].toLowerCase().localeCompare(b[0].toLowerCase())});

Stadium:'<p>Stadium has the most tricks of the 4 cars. The best place to learn them is the Trackmania school campaign.</p><h3>General</h3><p><b>Airbrake:</b> tap the brake while in the air. This stops your car\'s rotation.</p><p><b>Bugslide:</b> mostly used to make tight turns on dirt, grass and plastic, but possible on road. Hold drift inputs while the car is at 90 degrees on the ground.</p><p><b>Uberbug and nosebug:</b> mainly Kacky tricks, however I will put them in here. An uberbug is when you bugslide into a wall and hit it at 90 degrees. A nosebug is when you hold bugslide input while your car is perpendicular to the ground. Both give you a large amount of speed.</p><p><b>Speedsliding:</b> a trick used to gain speed when above 420 speed. It is possible on road, dirt, grass and plastic, although the overlay and minimum speed change slightly. <a href="https://www.youtube.com/watch?v=5d3sTjjV28c" target="_blank" rel="noopener">Here is a good tutorial.</a></p><p class="note">Speedsliding overlays by road (grey), dirt (slightly orange) and grass (green). Graphics by snixtho.</p><figure style="margin:12px 0"><figcaption><b>Road</b></figcaption><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAngAAAFOCAIAAACaPvdAAACf8UlEQVR42u2dd3hVVfb3T7k9FdKA0CEBQgu9C0SqIKAIIhYUHBC7o6Oj/lRkrCOKUi2IiPTepPceSigJhJIEQhLSQ/otp71/fGF7vDeJoCTBedfn8fEJyS3nrLP3anvttXlN0ziCIAiCICoHgURAEARBEGRoCYIgCIIMbWVCKW7irwyGv8v4+SvXqaoqjQ2CNO09iOGuf6KqqpqqiQaR/cblcplMpvIeKs/zbm8XBEGRFf0nVDwseJ7Xf45+oLh9eLWjyIogluvc4GolSTIajXgxhMDurqCg4Nq1a7m5uTabrXHjxjVr1hSEMj6NfQLem5qamp6e7nQ6AwMDW7RooZeVIiu8wJf5IdU7zzVNEwSBjSVN01wul9ls1o8TnufZjUiSxHGcwWDAb5xOp9FovJ37+nuNH/0U83xwmqrBc9aPHCY3zzmFuXabIrp3hgceEHv6mqapiqq/NfyG4zj8Ev6HJElms5m9vUwBus0gzwlY7dKAApFlmU3wCtSsqqqKomiapv+928TBu/Rjg+d5Nu+cTqfZbJYkSeAFXuD1b8SfquzG9TrN7Qb1v8ej5wWe4zg8XNyvLMtQDvpnis8s82ne5lO+/cHAV5L/omkau7c/vJq0tLRr165xHFe/fv3Q0NAyBwSUAjPDiqpkZ2dfu3ZNluXQ0NDGjRszFSlJUnl2vXpN7JatW95555309PTyXiOK4nvvvffCCy+4qUKn07lp06YFCxZs27ZNlmXcpslk6t2792OPPf le="max-width:100%;height:auto;border-radius:8px;display:block"></figure><p><b>Wiggling:</b> another way to gain speed, mainly done on road, plastic and grass, though it is possible on ice and bob. For speedsliding and wiggling, I recommend the Trackmania school tricks campaign, which also has neoslides, nosebugs and bugslides. <a href="https://www.youtube.com/watch?v=yAT7NKQCkJw" target="_blank" rel="noopener">Here is a wiggling tutorial.</a></p><h3>Road</h3><p><b>Normal drift:</b> possible above 180-200 speed. Steer in the direction you want to drift for about 0.5 seconds before you tap brake. Tap or hold brake to tighten the drift. Ideally you don\'t release during a drift.</p><p><b>Neoslide:</b> a way to drift below 200 speed. Steer fully in the direction you want to drift, stop steering, brake, then start steering again.</p><h3>Dirt, plastic and grass</h3><p>Gear management is one of the most important tricks here. The stadium car (the alt cars have no gears) has 5 gears that change at set speeds:</p><div class="wrap"><table><tr><th>Gear</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Speed</td><td>0</td><td>100</td><td>160</td><td>235</td><td>340</td></tr></table></div><p>It is also often useful to stop steering when you change surface, e.g. road to dirt and dirt to grass.</p><p>No-slides are another very important but advanced trick. I\'m not entirely sure how to get a good no-slide. I personally go from visually seeing if the car is sliding out and using a bit of action key 3 work.</p><h3>Ice</h3><p>The main trick on ice is an ice slide. I\'m again not an expert, but here is the gist of it: you want to turn the car so the nose faces where you want to go, then countersteer. Tap brake to tighten the slide and release to exit it.</p>',
Desert:'<p>I personally don\'t play much desert so this took a lot of video watching, feel free to give feedback in the feedback section.</p><p>The original school campaign is an amazing resource for learning and practising all cars, so try the desert campaign.</p><p>The most important thing is to <b>tap the steering</b>. This is faster because it keeps all 4 wheels on the ground, whereas without tapping 2 wheels lift up. The exception is when you are on penalty: tap side to side to wiggle over the penalty on only 2 wheels.</p><p>Sometimes you have to release to avoid sliding out in a corner. It is okay for the car to tilt, as long as it doesn\'t overtilt or slide out.</p>',
Rally:'<p><a href="https://www.youtube.com/watch?v=xOzJxvPJGS8" target="_blank" rel="noopener">General tutorial for rally.</a></p><p>It is extremely important not to slide out on rally. Practise with the original training rally campaign.</p><p>From my personal experience it is extremely helpful to bind action key 2 and 3 for rally maps as the car is so sensitive.</p><p>Learn when you will slide out, and brake or release accordingly. On penalty surfaces you can wiggle, which lifts one side of the car and reduces contact with the penalty.</p><p>Like snow, rally favours smooth steering because it is so sensitive.</p><p>Rally on ice can be hard but is simple: tap in the direction you want to go, and get the car as close to 90 degrees as possible without going over, because you slide out past 90.</p>',
Snow:'<p>Simple guide I found informative: <a href="'+YT1+'" target="_blank" rel="noopener">YouTube tutorial</a>.</p><p>Tips from my personal experience: use action keys, and practise in the original snow training campaign.</p><ul><li>No-sliding is almost always better on the snowcar. On dirt, road, plastic and grass, avoid sliding even if it means slowing down.</li><li>Smooth steer. On keyboard, tap quickly and use action keys. On controller, use the analogue sticks and maybe action keys too.</li><li>The snowcar accelerates extremely fast in reverse, capped at 150.</li><li>On bobsleigh, angle the nose up around 45 degrees. This applies to many sliding surfaces.</li><li>Go through booster gates perfectly straight for more speed.</li><li>Turning on wood, dip one side\'s wheels down slightly for extra speed. The game thinks you are going downhill. A visual for the last 3 tricks can be seen <a href="'+YT2+'" target="_blank" rel="noopener">here</a>.</li><li>You have almost no control on ice, but angling the car sideways is faster.</li></ul>'
};
var TECH='<h3>Can it run Trackmania 2020?</h3><p>I have recently done a huge amount of research into what will/won\'t run Trackmania 2020, and this is a short summary:</p><ul><li><b>CPU:</b> pretty much any modern Ryzen 5/7/9 or Intel i5/i7/i9 works.</li><li><b>Dedicated GPU:</b> most likely yes. Steer away from the GT 710 or anything that is just "GT".</li><li><b>Integrated GPU:</b> only the AMD Radeon 780M, 880M and 890M give 60fps, and you need 16GB of dual-channel RAM with them.</li></ul><h3>Optimising: disable high grass</h3><p>There are several ways to do it:</p><p><a href="https://www.youtube.com/shorts/ZIwSsl-GF5A" target="_blank" rel="noopener"><b>One:</b></a> This is the most recent and requires the least Openplanet use.</p><p><b>Two:</b></p><ol><li>Open the Openplanet settings (F3, then Settings). If Update Branch is Default, change it to Beta, then accept the update prompt.</li><li>After updating, find the plugin <b>Finetuner</b> in the settings.</li><li>In the Decals tab, enable "Override texture decals settings".</li><li>A new "3D decals" setting appears. Untick it to disable the grass.</li></ol><p>It should work next time you open the map. If not, restart the game.</p><p>Also see this <a href="https://threadnavigator.com/thread/1819340277082882388/" target="_blank" rel="noopener">detailed guide to maximise FPS</a>.</p>';

app.innerHTML='<h1>Trackipedia2020</h1><p class="sub" style="font-size:1.15rem;margin-top:8px">The somewhat complete beginners guide</p><div class="stripe"></div><div class="menu"><button class="btn b1" data-go="terms">Terms<small>Alphabetical and searchable</small></button><button class="btn b2" data-go="tricks">Tricks<small>Stadium, desert, rally and snow</small></button><button class="btn b3" data-go="tech">Tech<small>What runs it and how to boost FPS</small></button></div>'+foot();

q.oninput=draw;draw();wire();}

function tricks(){
app.innerHTML=head("Tricks","Pick a car.")+'<div class="tabs" id="tabs"></div><div class="box" id="body"></div>'+foot();
var cur="Stadium",tabs=document.getElementById("tabs"),body=document.getElementById("body");
function draw(){tabs.innerHTML="";Object.keys(CARS).forEach(function(c){var b=document.createElement("button");b.className="tab";b.textContent=c;b.setAttribute("aria-pressed",c===cur);b.onclick=function(){cur=c;draw();};tabs.appendChild(b);});body.innerHTML=CARS[cur]+'<p class="note" style="margin-top:18px">Once again, feel free to use the feedback page if you think I forgot something or should add something.</p>';}
draw();wire();}

function sources(){app.innerHTML=head("Sources")+'<div class="panel"><p style="margin-top:0">Most of the terms were copied from <a href="https://liquipedia.net/trackmania/Glossary" target="_blank" rel="noopener">https://liquipedia.net/trackmania/Glossary</a>.</p><p>However, all of the tips were typed out by me. The first part of the tech was also by me, the rest was from community posts.</p></div>'+foot();wire();}

function tech(){app.innerHTML=head("Tech","Hardware and performance tips.")+'<div class="box">'+TECH+'</div>'+foot();wire();}

var dbInst=null;
function chatDb(){if(!dbInst){if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);dbInst=firebase.firestore();try{dbInst.settings({experimentalAutoDetectLongPolling:true,merge:true});}catch(e){}}return dbInst;}
var unsub=null;
function feedback(){
app.innerHTML=head("Feedback","Everyone who uses Trackipedia2020 can see this chat. Tell us what to add or fix.")+'<div class="panel"><div class="chat" id="chat" aria-live="polite"><p class="empty">Loading messages...</p></div><div class="row"><input type="text" id="nm" maxlength="24" placeholder="Your username (optional)" aria-label="Your username"><textarea id="tx" rows="2" maxlength="500" placeholder="Type your feedback" aria-label="Feedback message"></textarea></div><div class="row" style="justify-content:space-between;align-items:center"><span class="note" id="st"></span><button class="send" id="sd">Send feedback</button></div></div>';
wire();
var chat=document.getElementById("chat"),st=document.getElementById("st"),nm=document.getElementById("nm"),tx=document.getElementById("tx"),sd=document.getElementById("sd");

if(!window.firebase||FIREBASE_CONFIG.apiKey.indexOf("YOUR_")===0){chat.innerHTML='<p class="empty">The chat is not set up yet. Add your Firebase config at the top of the script.</p>';sd.disabled=true;return;}
var col=chatDb().collection("feedback"),last=0,got=false;
setTimeout(function(){if(!got)chat.innerHTML='<p class="empty">Still can\'t reach the chat database. Try turning off ad blockers or privacy shields for this site, then refresh. Also check that Firestore is created and the rules are published.</p>';},8000);
unsub=col.orderBy("ts","asc").limitToLast(200).onSnapshot(function(snap){
got=true;chat.innerHTML="";
if(snap.empty){chat.innerHTML='<p class="empty">No feedback yet. Be the first to post.</p>';return;}
snap.docs.forEach(function(d){var m=d.data({serverTimestamps:"estimate"}),el=document.createElement("div"),b=document.createElement("b"),t=document.createElement("time"),p=document.createElement("div");
el.className="msg";b.textContent=m.name||"Anonymous";t.textContent=m.ts?m.ts.toDate().toLocaleString([], {dateStyle:"medium",timeStyle:"short"}):"";p.textContent=m.text||"";
el.appendChild(b);el.appendChild(t);el.appendChild(p);chat.appendChild(el);});
chat.scrollTop=chat.scrollHeight;
},function(e){got=true;chat.innerHTML="";var p=document.createElement("p");p.className="empty";p.textContent="Couldn't load messages ("+(e&&e.code?e.code:"unknown error")+"). Refresh to try again.";chat.appendChild(p);});
sd.onclick=function(){var text=tx.value.trim();if(!text){st.textContent="Type a message first.";return;}
if(Date.now()-last<10000){st.textContent="Please wait a few seconds before sending again.";return;}
var name=(nm.value.trim()||"Anonymous").slice(0,24);
sd.disabled=true;st.textContent="Sending...";var slow=setTimeout(function(){st.textContent="Still sending... if this never finishes, check your connection or ad blocker.";},8000);
col.add({name:name,text:text.slice(0,500),ts:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){clearTimeout(slow);last=Date.now();tx.value="";st.textContent="Sent.";sd.disabled=false;},function(e){clearTimeout(slow);st.textContent="Couldn't send ("+(e&&e.code?e.code:"error")+"). Try again.";sd.disabled=false;});};
}

function route(){if(unsub){try{unsub();}catch(e){}unsub=null;}
var h=location.hash.replace("#","");({terms:terms,tricks:tricks,tech:tech,feedback:feedback,sources:sources}[h]||home)();window.scrollTo(0,0);}

privacy:{title:"Privacy Policy",text:`Last updated: October 2026

The short version: this site does not collect or store any information about you, except two things: the username you type in when you give feedback, and the feedback you write. Nothing else.

What is stored: when you send feedback, three things are saved: the username you typed (or "Anonymous" if you left it blank), your message, and the time you sent it. Both are shown publicly to everyone who visits the feedback chat, so please don't put personal information in either.

What is not stored: there are no accounts or sign-ups, and I don't collect email addresses, locations, or browsing history. The site has no analytics, and it doesn't save anything on your device.

Removing a message: if you want something you posted removed, tell me in the feedback chat and I will take it down.

Advertising: this site shows ads from Google AdSense. I don't receive or store any data about you from these ads. Google and its partners may use cookies and similar technologies to show ads, which may be personalised based on your visits to this and other websites. This is Google's own data collection under Google's policies, not mine. You can manage ad personalisation at https://adssettings.google.com and read how Google uses data at https://policies.google.com/technologies/ads

Hosting: the site is hosted by GitHub Pages, and feedback is stored with Google Firebase. Like any web service, they may keep standard technical logs (such as IP addresses) to run their services. I don't collect or use those.

Support links: if you choose to donate through PayPal or Ko-fi, you leave this site and their own privacy policies apply.

Do not enter any personal information or identifiers.`},
about:{title:"About Us",text:`I made this guide because, as far as I know, there is no common guide to everything in Trackmania 2020, and I know I would have found it useful to have one when I started, especially some of the alt car and gear tricks.

Trackipedia2020 is in no way affiliated with Ubisoft or Nadeo; it is simply something I made in some spare time.

Where I was not sure myself about a trick, I would usually watch one of the linked tutorials and type a summary out, but link the full video. For desert car, I couldn't really find a good tutorial, which is why it is so short.

Feel free to give feedback; I will try to read most of it and implement some, although I do have other things to do, so don't expect edits every day, or even weekly, although I will aim to do it once a week.`}};
